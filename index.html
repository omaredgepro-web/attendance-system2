<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تسجيل الحضور اليومي</title>
  
  <!-- ربط ملف الـ Manifest لتثبيت التطبيق PWA -->
  <link rel="manifest" href="https://omaredgepro-web.github.io/attendance-system2/manifest.json">
  <meta name="theme-color" content="#10b981">

  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #0e13a4;
      --subtext-color: #7f8c8d;
      --input-bg: #f9fbfb;
      --border-color: #e2e8f0;
      --primary-color: #10b981;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --bg-color: #661C1E;
      --card-bg: #CD7A41;
      --text-color: #661C1E;
      --subtext-color: #661C1E;
      --input-bg: #f5f8fc;
      --border-color: #334155;
      --primary-color: #661C1E;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }

    .card {
      background: var(--card-bg); padding: 35px 30px; border-radius: 20px;
      box-shadow: var(--shadow); width: 100%; max-width: 420px; border: 1px solid var(--border-color);
    }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    h2 { margin: 0; font-size: 22px; font-weight: 700; }
    .form-group { margin-bottom: 20px; text-align: right; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: var(--subtext-color); }

    select, input[type="text"] {
      width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color);
      background-color: var(--input-bg); color: var(--text-color); font-size: 15px;
      font-family: 'Tajawal', sans-serif; outline: none;
    }

    input[readonly] { cursor: not-allowed; opacity: 0.85; font-weight: bold; background-color: #e2e8f0; }

    .btn-submit, .btn-install {
      width: 100%; padding: 15px; margin-top: 10px; border-radius: 12px; border: none;
      font-size: 16px; font-weight: 700; font-family: 'Tajawal', sans-serif; cursor: pointer;
    }
    .btn-submit { background-color: var(--primary-color); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
    .btn-install { background-color: #2563eb; color: white; display: none; margin-bottom: 10px; }

    .btn-submit:disabled { background-color: #94a3b8; cursor: not-allowed; box-shadow: none; }
    #status { margin-top: 20px; font-size: 14px; font-weight: 500; text-align: center; min-height: 24px; line-height: 1.5; }
    .card .header img { width: 45%; border-radius: 15px; }
    .status-success { color: #10b981; }
    .status-error { color: #ef4444; }
    .status-loading { color: #3b82f6; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>تسجيل الحضور</h2>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQWRngBxbivIyvtXpDf5llmZxK6iRZFyp6-_1pO5opOdZV89m5D56OQus&s=10" alt="Logo">
  </div>

  <button class="btn-install" id="btnInstall" onclick="installApp()">📱 تثبيت التطبيق على الشاشة الرئيسية</button>

  <div class="form-group">
    <label for="employee">اسم الموظف:</label>
    <select id="employee">
      <option value="">جاري تحميل الأسماء...</option>
    </select>
  </div>

  <div class="form-group">
    <label for="deviceId">معرّف الهاتف الثابت (Device ID):</label>
    <input type="text" id="deviceId" readonly placeholder="جاري قراءة معرّف الجهاز...">
  </div>

  <div class="form-group">
    <label for="site">الموقع:</label>
    <select id="site">
      <option value="From Site">Site</option>
      <option value="From Home">Home</option>
    </select>
  </div>

  <button class="btn-submit" id="btnSubmit" onclick="registerAttendance()">تسجيل الحضور الآن</button>
  <div id="status"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyrNlSdWmNdiXO7MWmjGTm-rCd-pr-DU2p_vlRVDv2k8Yd8_Rlc79elW4qX0IIrMkymxA/exec"; 

  // 1. إنشاء و قراءة معرّف الجهاز الثابت محلياً
  function getOrCreatePersistentDeviceId() {
    let devId = localStorage.getItem("permanent_device_id");
    if (!devId) {
      devId = 'PWA_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now().toString(36);
      localStorage.setItem("permanent_device_id", devId);
    }
    document.getElementById("deviceId").value = devId;
    return devId;
  }

  getOrCreatePersistentDeviceId();

  // 2. إتاحة خيار تثبيت التطبيق PWA
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('btnInstall').style.display = 'block';
  });

  function installApp() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          document.getElementById('btnInstall').style.display = 'none';
        }
        deferredPrompt = null;
      });
    }
  }

  // 3. جلب قائمة الموظفين من الشيت
  function fetchEmployees() {
    const select = document.getElementById("employee");
    select.innerHTML = '<option value="">جاري تحميل الأسماء...</option>';

    const callbackName = 'handleEmployeesResponse_' + Math.round(100000 * Math.random());
    
    window[callbackName] = function(employees) {
      delete window[callbackName];
      const oldScript = document.getElementById('jsonp_script');
      if (oldScript && oldScript.parentNode) oldScript.parentNode.removeChild(oldScript);

      if (Array.isArray(employees) && employees.length > 0) {
        select.innerHTML = '<option value="">اختر اسمك من القائمة...</option>';
        employees.forEach(emp => {
          const opt = document.createElement('option');
          opt.value = emp;
          opt.innerText = emp;
          select.appendChild(opt);
        });
      } else {
        select.innerHTML = '<option value="">لا توجد أسماء في شيت Employee</option>';
      }
    };

    const script = document.createElement('script');
    script.id = 'jsonp_script';
    script.src = SCRIPT_URL + '?action=getEmployees&callback=' + callbackName;
    script.onerror = function() {
      select.innerHTML = '<option value="">تعذر تحميل الأسماء (تأكد من الشبكة)</option>';
    };
    document.body.appendChild(script);
  }

  fetchEmployees();

  // 4. تسجيل الحضور وإرسال البيانات
  function registerAttendance() {
    const employee = document.getElementById("employee").value;
    const deviceId = document.getElementById("deviceId").value.trim();
    const site = document.getElementById("site").value;
    const statusDiv = document.getElementById("status");
    const btn = document.getElementById("btnSubmit");

    if (!employee) {
      alert("يرجى اختيار اسم الموظف أولاً");
      return;
    }

    btn.disabled = true;
    statusDiv.className = "status-loading";
    statusDiv.innerHTML = "⏳ جاري التحقق من الموقع وجهاز الموظف...";

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition((position) => {
        const location = position.coords.latitude + "," + position.coords.longitude;
        statusDiv.innerHTML = "📡 جاري إرسال البيانات...";

        const callbackName = 'handleRegisterResponse_' + Math.round(100000 * Math.random());

        window[callbackName] = function(response) {
          delete window[callbackName];
          const oldScript = document.getElementById('jsonp_reg_script');
          if (oldScript && oldScript.parentNode) oldScript.parentNode.removeChild(oldScript);
          btn.disabled = false;

          if (response.status === "success") {
            statusDiv.className = "status-success";
            statusDiv.innerHTML = response.message;
          } else {
            statusDiv.className = "status-error";
            statusDiv.innerHTML = response.message;
          }
        };

        const params = new URLSearchParams({
          action: "register",
          employee_name: employee,
          site: site,
          location: location,
          device_id: deviceId,
          callback: callbackName
        });

        const script = document.createElement('script');
        script.id = 'jsonp_reg_script';
        script.src = SCRIPT_URL + "?" + params.toString();
        script.onerror = function() {
          btn.disabled = false;
          statusDiv.className = "status-error";
          statusDiv.innerHTML = "❌ تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً.";
        };

        document.body.appendChild(script);

      }, (error) => {
        statusDiv.className = "status-error";
        statusDiv.innerHTML = "❌ يرجى تفعيل الـ GPS والسماح بالوصول لموقعك!";
        btn.disabled = false;
      }, { enableHighAccuracy: true, timeout: 10000 });
    } else {
      alert("المتصفح لا يدعم تحديد الموقع الجغرافي.");
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
