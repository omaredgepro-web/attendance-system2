  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #0e13a4;
      --subtext-color: #7f8c8d;
      --input-bg: #f9fbfb;
      --border-color: #e2e8f0;
      --primary-color: #10b981;
      --primary-hover: #c0db28;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    [data-theme="dark"] {
      --bg-color: #661C1E;
      --card-bg: #CD7A41;
      --text-color: #661C1E;
      --subtext-color: #661C1E;
      --input-bg: #f5f8fc;
      --border-color: #334155;
      --primary-color: #661C1E;
      --primary-hover: #f00606;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border-color);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Tajawal', sans-serif;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--subtext-color);
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-color);
      font-size: 15px;
      font-family: 'Tajawal', sans-serif;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--primary-color);
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border-radius: 12px;
      border: none;
      background-color: var(--primary-color);
      color: white;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Tajawal', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      min-height: 24px;
      line-height: 1.5;
    }
    .card .header img{
    width: 50%;
    border-radius: 15px;
    }

    .status-success { color: #10b981; }
    .status-error { color: #ef4444; }
    .status-loading { color: #3b82f6; }
  </style>
  <script src="https://openfpcdn.io/fingerprintjs/v3/i.js"></script>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>LOG IN</h2>

  </div>
